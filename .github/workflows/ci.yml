name: Clinic CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clinic-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit, component and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test:coverage
      - run: npx playwright install --with-deps chromium
      # Playwright builds and serves the production bundle, then exercises desktop and mobile.
      - run: npm run test:e2e
      - name: Upload coverage and browser reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webapp-test-reports
          path: |
            coverage/
            playwright-report/
            .context/test-results/
          include-hidden-files: true
          retention-days: 14
